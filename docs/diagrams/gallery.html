<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn DeepInfer · Framework atlas</title><link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<style>
:root{--paper:#f5f4ef;--ink:#202d29;--green:#19654e;--muted:#778078;--line:#dce1d7;--sage:#e7eee1;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}.figure{width:1200px;height:760px;background:var(--paper);position:relative;overflow:hidden;padding:48px 54px}.figure:before{content:"";position:absolute;width:450px;height:450px;right:-160px;top:-230px;border:1px solid #dce1d7;border-radius:50%;box-shadow:0 0 0 49px #e4e8de}.eyebrow{font:600 11px var(--mono);letter-spacing:2px;color:var(--green)}.heading{display:flex;justify-content:space-between;position:relative}.heading h1{font-size:42px;font-weight:650;letter-spacing:-1.6px;line-height:1.18;margin:16px 0 12px}.heading p{margin:0;font-size:16px;color:var(--muted);line-height:1.65}.page-num{font:12px var(--mono);color:var(--muted);padding-top:8px;border-top:1px solid var(--line);text-align:right;min-width:86px}.footer{position:absolute;left:54px;right:54px;bottom:28px;border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;font:10px var(--mono);letter-spacing:1.1px;color:#7c857b}.brand{color:var(--green);font-weight:700}.card{border:1px solid var(--line);background:#fffefa;border-radius:15px;position:relative}.small{font:10px var(--mono);letter-spacing:1px;color:#728570}.tag{display:inline-block;padding:6px 8px;border-radius:5px;background:#eff2e9;color:#52705d;font:10px var(--mono)}.roadmap{position:absolute;top:225px;left:54px;right:54px;display:grid;grid-template-columns:repeat(4,1fr);gap:19px}.layer{height:340px;padding:22px 20px}.layer-head{display:flex;justify-content:space-between;align-items:center}.layer-icon{width:34px;height:34px;background:#ecf2e7;border:1px solid #d4dfcf;border-radius:9px;display:grid;place-items:center;color:var(--green);font-size:19px}.layer h2{font-size:24px;line-height:1.18;letter-spacing:-.8px;margin:24px 0 13px;font-weight:600}.layer p{font-size:12px;line-height:1.8;color:#788373;margin:0}.mini{height:64px;background:#f0f4eb;border-radius:9px;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:6px}.mini i{display:block;width:28px;height:28px;background:#d6e3cd;border:1px solid #bacead;border-radius:5px}.mini i.active{background:#19654e;border-color:#19654e}.mini .arrow{color:#87a07c;font-size:15px}.courses{position:absolute;left:20px;bottom:20px;display:flex;gap:5px}.layer:nth-child(2){background:#f0f5eb}.layer:nth-child(3){background:#fcfaf3}.layer:nth-child(4){background:#edf2ed}.strip{position:absolute;left:54px;right:54px;top:600px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:25px;border-top:1px solid var(--line);padding-top:20px}.strip b{font-size:14px;font-weight:600}.strip p{font-size:12px;color:var(--muted);margin:8px 0;line-height:1.5}.equations{position:absolute;left:54px;right:54px;top:227px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.equation{height:204px;padding:22px 25px}.equation .small{font-size:10px}.equation h2{font-size:19px;font-weight:600;margin:12px 0 4px;letter-spacing:-.4px}.math{font-size:22px}.katex-display{margin:18px 0 12px}.equation p{font-size:12px;color:var(--muted);line-height:1.65;margin:8px 0 0}.equation:nth-child(2),.equation:nth-child(3){background:#eef3e8}.equation:nth-child(2) .math{font-size:19px}.equation:nth-child(3) .math{font-size:19px}.note{position:absolute;left:54px;right:54px;top:668px;font-size:11px;color:#7a8775}.page-layout{position:absolute;left:54px;right:54px;top:230px;display:grid;grid-template-columns:1.1fr .9fr 1.1fr;gap:65px}.page-panel{height:314px;padding:24px}.page-panel h2{font-size:22px;letter-spacing:-.5px;margin:15px 0 23px;font-weight:600}.tokens{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tokens i{display:grid;place-items:center;height:44px;background:#edf2e6;border:1px solid #d4dfc9;color:#67825b;border-radius:5px;font:12px var(--mono);font-style:normal}.tokens i:nth-child(n+5):nth-child(-n+8){background:#dbe7d1}.tokens i:nth-child(n+9){background:#c9dabc}.mapping{display:flex;flex-direction:column;gap:12px}.mapping div{display:flex;justify-content:space-between;font:13px var(--mono);padding:12px;background:#f0f3ea;border-radius:5px;color:#56724c}.physical{display:flex;flex-direction:column;gap:9px}.physical div{height:39px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:12px var(--mono);border:1px solid #d1ddc8;background:#edf2e7;color:#63805a}.physical .used{background:#dbe7d1;color:#365e36;border-color:#b9cca9}.physical .free{border-style:dashed;background:transparent;color:#97a08d}.wires{position:absolute;inset:0;pointer-events:none}.wires path{fill:none;stroke:#7f9a76;stroke-width:1.6}.wires text{font:11px var(--mono);fill:#728c69}.example{position:absolute;left:54px;right:54px;top:580px;padding:22px 26px;background:#e9f0e1;border:1px solid #d2dfc7;border-radius:11px;display:flex;align-items:center;justify-content:space-between}.example b{display:block;font-size:18px;font-weight:550}.example p{margin:8px 0 0;color:#78896e;font-size:12px}.example .math{font-size:19px}
.equations{top:215px;gap:16px 20px}.equation{height:212px}.equation h2{margin:10px 0 8px}.equation .math{height:64px;display:grid;place-items:center;font-size:20px}.equation .katex-display{margin:0}.equation p{font-size:11.5px;line-height:1.6}.equation:nth-child(2) .math,.equation:nth-child(3) .math{font-size:18px}</style></head><body><main class="figure" id="figure"></main><script src="node_modules/katex/dist/katex.min.js"></script><script>
const footer=(label)=>`<footer class="footer"><span class="brand">▰ LEARN DEEPINFER</span><span>${label}</span><span>READ THE SYSTEM.</span></footer>`;
const head=(num,kicker,title,sub)=>`<header class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="page-num">FIG. ${num}<br><span style="display:block;margin-top:9px;font-size:9px;letter-spacing:1px">FRAMEWORK ATLAS</span></div></header>`;
const math=expr=>`<div class="math" data-math="${expr.replaceAll('"','&quot;')}"></div>`;
const tag=ids=>`<div class="courses">${ids.map(id=>`<span class="tag">${id}</span>`).join('')}</div>`;
const layer=(num,icon,title,sub,mini,ids)=>`<section class="layer card"><div class="layer-head"><span class="small">${num}</span><span class="layer-icon">${icon}</span></div><h2>${title}</h2><p>${sub}</p><div class="mini">${mini}</div>${tag(ids)}</section>`;
const arrow='<span class="arrow">→</span>';
const templates={
architecture:()=>head('01','A READING MAP / FOUR RESPONSIBILITIES','Read DeepInfer as a connected system.','A course map of responsibilities — not a literal dependency graph.')+`<div class="roadmap">`+
layer('01 / ENGINE','↻','Follow the<br>request.','Entry point · execution round<br>Sampling · state updates','<i></i>'+arrow+'<i class="active"></i>'+arrow+'<i></i>',['s01','s02','s04'])+
layer('02 / STATE','▦','Locate the<br>shared state.','KV state · block mapping<br>Prefix reuse', '<div style="display:grid;grid-template-columns:repeat(6,22px);gap:5px">'+ '<i style="width:22px;height:15px"></i>'.repeat(12)+'</div>',['s03','s07','s08'])+
layer('03 / SCHEDULING','≡','Plan the<br>next round.','Batch admission · verification<br>Execution overlap','<div style="display:grid;grid-template-columns:repeat(4,32px);gap:5px">'+'<i style="width:32px;height:10px"></i>'.repeat(12)+'</div>',['s05','s06','s09','s10'])+
layer('04 / EXPERTS','⌘','Route and<br>rebalance.','Dispatch · expert computation<br>Combine · replica placement','<i style="border-radius:50%"></i>'+arrow+'<i class="active" style="border-radius:50%;width:38px;height:38px"></i>'+arrow+'<i style="border-radius:50%"></i>',['s11','s12'])+`</div><div class="strip"><div><b>01 / Build the map</b><p>Identify who owns each responsibility.</p></div><div><b>02 / Observe a transition</b><p>Follow request, cache, and routing state.</p></div><div><b>03 / Read the source</b><p>Trace the same concept in pinned DeepInfer code.</p></div></div>`+footer('12 LESSONS / ONE SOURCE MAP'),
formulas:()=>head('04','FOUR IDEAS / FOUR EQUATIONS','Make the framework relationships explicit.','Conceptual notation for the mechanisms explained in the course.')+`<div class="equations"><section class="equation card"><div class="small">01 / SCHEDULING</div><h2>Stay within the round budget.</h2>${math(String.raw`\sum_{i\in\mathcal{S}_t}q_i\leq B_t`)}<p>Selected requests consume token work qᵢ.<br>Admission also depends on available state and policy.</p></section><section class="equation card"><div class="small">02 / PAGED STATE</div><h2>Resolve a logical token position.</h2>${math(String.raw`b=\left\lfloor t/P\right\rfloor,\quad o=t\bmod P`)}<p>Block size P → logical block b and offset o.<br>The block table resolves b to a physical block.</p></section><section class="equation card"><div class="small">03 / PREFIX REUSE</div><h2>Reuse a matching prefix state.</h2>${math(String.raw`K=H\!\left(K_{\rm parent},\;\text{tokens},\;\text{context}\right)`)}<p>A conceptual chained identity for prefix blocks.<br>Reuse requires matching state, not just matching words.</p></section><section class="equation card"><div class="small">04 / EXPERT ROUTING</div><h2>Combine selected expert outputs.</h2>${math(String.raw`y=\sum_{e\in\mathcal{S}(x)}w_e\,E_e(x)`)}<p>S(x): selected expert set · Eₑ: expert computation.<br>Shared experts and routing-specific details are omitted.</p></section></div><p class="note">Illustrative notation, not exact source expressions. See the guide for definitions and implementation boundaries.</p>`+footer('BUDGET / ADDRESS / IDENTITY / ROUTING'),
cache:()=>head('03','KV STATE / LOGICAL TO PHYSICAL','Logical order. Scattered physical blocks.','A simplified block-table view of paged state management.')+`<svg class="wires" viewBox="0 0 1200 760"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" style="stroke:#7f9a76"/></marker></defs><path d="M389 381 H443" marker-end="url(#arrow)"/><path d="M717 359 H760 V337 H810" marker-end="url(#arrow)"/><path d="M717 409 H772 V481 H810" marker-end="url(#arrow)"/><path d="M717 460 H788 V385 H810" marker-end="url(#arrow)"/></svg><div class="page-layout"><section class="page-panel card"><div class="small">01 / LOGICAL SEQUENCE</div><h2>Token positions</h2><div class="tokens">${Array.from({length:12},(_,i)=>`<i>${i}</i>`).join('')}</div><p style="font-size:12px;color:#829077;margin-top:17px">P = 4 positions per logical block</p></section><section class="page-panel card"><div class="small">02 / BLOCK TABLE</div><h2>Address mapping</h2><div class="mapping"><div><span>block 0</span><b>→ 7</b></div><div><span>block 1</span><b>→ 2</b></div><div><span>block 2</span><b>→ 9</b></div></div></section><section class="page-panel card"><div class="small">03 / PHYSICAL POOL</div><h2>Scattered blocks</h2><div class="physical"><div class="used"><span>physical 7</span><span>0 · 1 · 2 · 3</span></div><div class="used"><span>physical 9</span><span>8 · 9 · 10 · 11</span></div><div class="free"><span>physical 5</span><span>available</span></div><div class="used"><span>physical 2</span><span>4 · 5 · 6 · 7</span></div></div></section></div><aside class="example"><div><b>Position 9 → logical block 2 → physical block 9</b><p>The token stays at offset 1; physical storage is resolved by the sequence's block table.</p></div>${math(String.raw`9=2\times4+1`)}</aside>`+footer('ADDRESSING EXAMPLE / NOT A MEMORY LAYOUT SPECIFICATION')
};
const kind=new URLSearchParams(location.search).get('kind')||'architecture';
if(!templates[kind])throw new Error('Unknown figure '+kind);
document.querySelector('#figure').innerHTML=templates[kind]();
for(const el of document.querySelectorAll('[data-math]'))katex.render(el.dataset.math,el,{displayMode:true,throwOnError:true});
window.__figureReady=true;
</script></body></html>
